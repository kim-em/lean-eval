id = "rokhlin_lemma"
title = "Rokhlin lemma"
test = false
module = "LeanEval.Dynamics.RokhlinLemma"
holes = ["rokhlin_lemma"]
submitter = "Kim Morrison"
notes = "§109 of Knill's 'Some Fundamental Theorems in Mathematics' gives the classical automorphism form. This problem uses a stronger non-invertible, forward-image formulation: every aperiodic measure-preserving transformation of a standard Borel probability space admits, for every height n and every ε > 0, a measurable base B such that B, T B, …, T^{n-1} B are pairwise disjoint with total measure ≥ 1 - ε. Only the base B is required measurable by IsRokhlinTower. The [StandardBorelSpace Ω] hypothesis is essential: the countable-cocountable σ-algebra on ℝ with the integer-shift map x ↦ x + 1 is aperiodic and measure-preserving but admits no nontrivial Rokhlin towers (every cocountable base intersects its own shift; every countable base has zero-measure tower). Mathlib has MeasurePreserving, IsProbabilityMeasure, Function.periodicPts, Set.PairwiseDisjoint, and StandardBorelSpace, but no Rokhlin lemma. The Challenge ships four small helper defs (IsAperiodic, towerFloor, towerUnion, IsRokhlinTower)."
source = "V. A. Rokhlin, *A general measure-preserving transformation is not mixing*, Doklady Akademii Nauk SSSR 60 (1948), 349-351 (original Russian; English translation later); S. Kakutani, *Induced measure-preserving transformations*, Proc. Imp. Acad. Tokyo 19 (1943), 635-641 (independent discovery); A. Avila and P. Candela, *Towers for commuting endomorphisms, and combinatorial applications*, Ann. Inst. Fourier 66 (2016), 1529-1544. The classical form is listed as §109 in O. Knill, *Some Fundamental Theorems in Mathematics* (https://people.math.harvard.edu/~knill/graphgeometry/papers/fundamental.pdf)."
informal_solution = "Apply the non-invertible Rokhlin lemma in its usual preimage form to obtain a high-measure tower C, T⁻¹ C, …, T⁻⁽ⁿ⁻¹⁾ C. Taking B = T⁻⁽ⁿ⁻¹⁾ C turns these into forward-image floors: the forward images of B lie in the corresponding preimage floors and hence are pairwise disjoint. A measure-preserving self-map of a standard probability space is essentially surjective, so the forward-image union has the same measure as the preimage tower."
